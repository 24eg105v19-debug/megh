name: Keep backend awake

# DISABLED automatic schedule on purpose.
# Pinging every 5 minutes kept the Render free instance awake ~24/7, which
# exhausted the 750 free instance-hours/month and got the service suspended
# (503 / x-render-routing: hibernate-wake-error). Run this manually only when
# you need to pre-warm the backend (e.g. before a demo).
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          URL="https://spending-smarter-backend.onrender.com/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              echo "backend awake"
              exit 0
            fi
            sleep 20
          done
          echo "backend did not answer with 200 in time"
          exit 0
