name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          URL="https://spending-smarter-backend.onrender.com/api/categories"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              echo "backend awake"
              exit 0
            fi
            sleep 20
          done
          echo "backend did not answer with 200 in time"
          exit 0
